{% extends 'base.html' %}

{% block title %}Posts{% endblock title %}

{% block content %}
<div class="mt-10 space-y-16 border-t border-gray-200 pt-10 sm:mt-16 sm:pt-16">
    {% for post in posts %}
        <article class="flex max-w-xl flex-col items-start justify-between">
            <div class="flex items-center gap-x-4 text-xs">
                <time datetime="{{ post.publish }}" class="text-gray-500">{{ post.publish }}</time>
                <a href="#"
                    class="relative z-10 rounded-full bg-gray-50 px-3 py-1.5 font-medium text-gray-600 hover:bg-gray-100">tag1</a>
                <a href="#"
                    class="relative z-10 rounded-full bg-gray-50 px-3 py-1.5 font-medium text-gray-600 hover:bg-gray-100">tag2</a>
            </div>
            <div class="group relative">
                <h3 class="mt-3 text-lg font-semibold leading-6 text-gray-900 group-hover:text-gray-600">
                    <a href="{{ post.get_absolute_url }}">
                        <span class="absolute inset-0"></span>
                        {{ post.title }}
                    </a>
                </h3>
                <p class="mt-5 line-clamp-3 text-sm leading-6 text-gray-600">
                    {{ post.body }}
                </p>
            </div>
        </article>
    {% endfor %}

    {% include 'post/pagination.html' %}
</div>
{% endblock content %}
